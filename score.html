<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章评分｜社论 · 申论综合评审</title>
<style>
  :root{
    --paper:#FAF7F2; --ink:#1C1B19; --muted:#6B6459; --accent:#B3372B;
    --rule:#E2DCD2; --link:#2F4156; --panel:#FFFFFF; --ok:#2F6B4F; --warn:#A6642A;
    --serif:"Noto Serif SC","Source Han Serif SC","Songti SC",serif;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.8;}
  .topbar{background:#22201D;color:#F5F0E8;padding:.85rem 1.4rem;display:flex;flex-wrap:wrap;align-items:center;gap:1rem;}
  .topbar .brand{font-family:var(--serif);font-size:1.15rem;font-weight:700;letter-spacing:.06em;}
  .topbar .brand em{color:var(--accent);font-style:normal;}
  .topbar nav{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap;}
  .topbar nav a{color:#E9E2D6;text-decoration:none;font-size:.88rem;padding:.32rem .85rem;border:1px solid #4A453E;}
  .topbar nav a.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .badge{font-size:.75rem;padding:.15rem .6rem;border:1px solid #4A453E;color:#C9BFAE;}
  .badge.ok{color:#9BD3B3;border-color:#3C6B54;}
  main{max-width:62rem;margin:0 auto;padding:1.6rem 1.2rem 3.5rem;}
  section.panel{background:var(--panel);border:1px solid var(--rule);padding:1.5rem 1.6rem 1.7rem;margin-bottom:1.5rem;}
  .sec-head{display:flex;align-items:baseline;gap:.8rem;border-bottom:1px solid var(--rule);padding-bottom:.8rem;margin-bottom:1.2rem;}
  .sec-num{font-family:var(--serif);color:var(--accent);font-size:1.5rem;font-weight:700;line-height:1;}
  .sec-head h2{font-family:var(--serif);font-size:1.22rem;margin:0;font-weight:700;}
  .sec-head .hint{margin-left:auto;font-size:.8rem;color:var(--muted);}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.95rem 1.1rem;}
  label.f{display:block;font-size:.82rem;color:var(--muted);letter-spacing:.04em;}
  input[type=text],input[type=password],input[type=number],select,textarea{
    width:100%;padding:.55rem .7rem;border:1px solid var(--rule);background:#FDFCFA;
    font-family:inherit;font-size:.92rem;color:var(--ink);border-radius:0;margin-top:.3rem;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid #D9B7AF;border-color:var(--accent);}
  textarea{line-height:1.8;resize:vertical;}
  #articleIn{min-height:18rem;font-family:var(--serif);font-size:1rem;}
  .row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem;}
  button{font-family:inherit;font-size:.9rem;padding:.55rem 1.15rem;border:1px solid var(--accent);
    background:var(--accent);color:#fff;cursor:pointer;letter-spacing:.05em;}
  button.ghost{background:transparent;color:var(--accent);}
  button.dark{background:#22201D;border-color:#22201D;}
  button:disabled{opacity:.45;cursor:not-allowed;}
  button:hover:not(:disabled){filter:brightness(1.08);}
  .status{font-size:.83rem;color:var(--muted);margin-left:.4rem;align-self:center;}
  .status.ok{color:var(--ok);} .status.err{color:var(--accent);} .status.busy{color:var(--warn);}
  .tip{font-size:.8rem;color:var(--muted);margin:.7rem 0 0;}
  .tip b{color:var(--warn);}
  .dims{display:grid;grid-template-columns:repeat(auto-fit,minmax(13.5rem,1fr));gap:.75rem 1.1rem;margin-top:.4rem;}
  .dim{border:1px solid var(--rule);padding:.65rem .85rem;display:flex;align-items:center;gap:.65rem;}
  .dim input[type=checkbox]{width:auto;margin:0;}
  .dim .nm{font-size:.9rem;flex:1;}
  .dim input[type=number]{width:4.2rem;margin:0;padding:.35rem .45rem;}
  /* 体检结果 */
  .check-list{list-style:none;margin:.6rem 0 0;padding:0;}
  .check-list li{border-left:3px solid var(--rule);padding:.45rem .9rem;margin-bottom:.55rem;font-size:.88rem;}
  .check-list li.warn{border-left-color:var(--warn);}
  .check-list li.bad{border-left-color:var(--accent);}
  .check-list li.good{border-left-color:var(--ok);}
  /* 评分报告 */
  .report{border:1px solid var(--rule);background:#FCFAF6;padding:1.5rem 1.6rem;}
  .score-hero{display:flex;flex-wrap:wrap;align-items:center;gap:1.4rem;border-bottom:1px solid var(--rule);padding-bottom:1.15rem;margin-bottom:1.15rem;}
  .score-big{font-family:var(--serif);font-size:3.2rem;font-weight:700;line-height:1;color:var(--accent);}
  .score-big small{font-size:1rem;color:var(--muted);font-weight:400;}
  .grade-chip{border:1px solid var(--accent);color:var(--accent);padding:.3rem .95rem;font-size:.92rem;letter-spacing:.12em;}
  .bar-row{margin:.55rem 0;}
  .bar-row .bl{display:flex;justify-content:space-between;font-size:.86rem;color:var(--muted);}
  .bar{height:.65rem;background:#EFE8DC;margin-top:.28rem;}
  .bar i{display:block;height:100%;background:var(--accent);}
  .bar-row .cmt{font-size:.85rem;color:var(--ink);margin-top:.35rem;line-height:1.75;}
  .rep-block{margin-top:1.35rem;}
  .rep-block h3{font-family:var(--serif);font-size:1.05rem;margin:0 0 .55rem;border-left:3px solid var(--accent);padding-left:.7em;}
  .rep-block ul{margin:0;padding-left:1.35em;}
  .rep-block li{margin-bottom:.55rem;font-size:.93rem;line-height:1.85;}
  .rep-block p{margin:0;font-size:.95rem;line-height:1.9;}
  footer{max-width:62rem;margin:0 auto;padding:0 1.2rem 2.6rem;color:var(--muted);font-size:.8rem;}
  a{color:var(--link);}
  @media (max-width:640px){main{padding:1.1rem .8rem 2.4rem;}section.panel{padding:1.15rem 1rem;}.score-big{font-size:2.5rem;}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">社论<em>·</em>工坊</div>
  <span class="badge" id="apiBadge">API 未配置</span>
  <nav>
    <a href="index.html">生成工作台</a>
    <a class="on" href="score.html">文章评分</a>
  </nav>
</div>

<main>
  <!-- ① 文章输入 -->
  <section class="panel">
    <div class="sec-head">
      <span class="sec-num">一</span>
      <h2>待评文章</h2>
      <span class="hint">支持社论与申论，粘贴全文即可</span>
    </div>
    <div class="grid">
      <label class="f">文体
        <select id="s-type">
          <option value="社论">社论 / 时评</option>
          <option value="申论大作文">申论大作文</option>
          <option value="申论小题">申论小题（概括·分析·对策）</option>
        </select></label>
      <label class="f">题目 / 材料要求（可选，申论建议填写）
        <input type="text" id="s-topic" placeholder="例。围绕“城市更新与财政转型”写一篇议论文"></label>
      <label class="f">评分严格度
        <select id="s-strict">
          <option value="标准">标准（阅卷中位线）</option>
          <option value="严格">严格（高分卷尺度）</option>
          <option value="宽松">宽松（鼓励性点评）</option>
        </select></label>
      <label class="f">目标读者 / 用途（可选）
        <input type="text" id="s-audience" placeholder="例。备考冲刺，目标一类文"></label>
    </div>
    <label class="f" style="margin-top:.95rem;">文章正文
      <textarea id="articleIn" spellcheck="false" placeholder="在此粘贴社论或申论文章全文……"></textarea>
    </label>
    <div class="row">
      <span class="status" id="countInfo">0 字</span>
    </div>
  </section>

  <!-- ② 评分维度 -->
  <section class="panel">
    <div class="sec-head">
      <span class="sec-num">二</span>
      <h2>评分维度与权重</h2>
      <span class="hint">满分 100，可勾选与调整权重</span>
    </div>
    <div class="dims" id="dimBox">
      <label class="dim"><input type="checkbox" data-name="立意高度" checked><span class="nm">立意高度（观点与站位）</span><input type="number" value="20" min="0" max="100"></label>
      <label class="dim"><input type="checkbox" data-name="论证逻辑" checked><span class="nm">论证逻辑（论点·论据·推理）</span><input type="number" value="25" min="0" max="100"></label>
      <label class="dim"><input type="checkbox" data-name="表述水平" checked><span class="nm">表述水平（准确·凝练·流畅）</span><input type="number" value="20" min="0" max="100"></label>
      <label class="dim"><input type="checkbox" data-name="语言风格" checked><span class="nm">语言风格（文气与辨识度）</span><input type="number" value="10" min="0" max="100"></label>
      <label class="dim"><input type="checkbox" data-name="结构层次" checked><span class="nm">结构层次（起承转合）</span><input type="number" value="15" min="0" max="100"></label>
      <label class="dim"><input type="checkbox" data-name="素材与规范" checked><span class="nm">素材与规范（数据·引用·格式）</span><input type="number" value="10" min="0" max="100"></label>
    </div>
    <div class="row">
      <button class="dark" id="btnLocal">本地体检（不调用 API）</button>
      <button id="btnScore">AI 综合评分</button>
      <button class="ghost" id="btnCopyReport">复制评分报告</button>
      <button class="ghost" id="btnDownloadReport">下载评分报告 .md</button>
      <span class="status" id="scoreStatus"></span>
    </div>
    <div id="localBox" style="margin-top:1.1rem;"></div>
    <p class="tip">评分由外接 API 完成，接口配置在 <a href="index.html">生成工作台 · API 接口设置</a> 中保存后本页自动复用。</p>
  </section>

  <!-- ③ API 复用状态 -->
  <section class="panel">
    <div class="sec-head">
      <span class="sec-num">三</span>
      <h2>接口复用</h2>
      <span class="hint">与生成工作台共用同一套配置</span>
    </div>
    <div class="grid">
      <label class="f">base_url（复用工作台配置，可临时覆盖）
        <input type="text" id="a-base" placeholder="https://api.deepseek.com/v1"></label>
      <label class="f">模型名
        <input type="text" id="a-model" placeholder="deepseek-chat"></label>
      <label class="f">API Key（仅保存在本机浏览器）
        <input type="password" id="a-key" placeholder="sk-..."></label>
    </div>
    <div class="row">
      <button class="ghost" id="btnSaveApi">保存并复用</button>
      <button class="ghost" id="btnSync">同步工作台配置</button>
      <span class="status" id="apiStatus"></span>
    </div>
    <p class="tip">密钥仅写入本机 <b>localStorage</b>，不上传、不写入文件。如遇跨域受限，请在生成工作台的高级选项中配置代理地址。</p>
  </section>

  <!-- ④ 评分报告 -->
  <section class="panel" id="reportPanel" style="display:none;">
    <div class="sec-head">
      <span class="sec-num">四</span>
      <h2>综合评分报告</h2>
      <span class="hint">含可改进点、精彩之处与可学之处</span>
    </div>
    <div class="report" id="reportBox"></div>
  </section>
</main>

<footer>
  社论·工坊｜评分维度与权重可自由调整，模型评分为辅助参考，重要考试请以官方阅卷标准为准。
</footer>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var CFG_KEYS = {base:"sheping.api.base", model:"sheping.api.model", key:"sheping.api.key",
    temp:"sheping.api.temp", system:"sheping.api.system", timeout:"sheping.api.timeout",
    endpoint:"sheping.api.endpoint"};

  function g(k){ try{ return localStorage.getItem(k) || ""; }catch(e){ return ""; } }
  function getConfig(){
    return {
      base: ($("a-base").value.trim() || g(CFG_KEYS.base)).replace(/\/+$/,""),
      model: $("a-model").value.trim() || g(CFG_KEYS.model),
      key: $("a-key").value.trim() || g(CFG_KEYS.key),
      temp: parseFloat(g(CFG_KEYS.temp) || "0.7"),
      timeout: parseInt(g(CFG_KEYS.timeout) || "300", 10),
      endpoint: g(CFG_KEYS.endpoint)
    };
  }
  var DEFAULT_BASE = "https://api.deepseek.com/v1";
  var DEFAULT_MODEL = "deepseek-chat";
  var dirty = false;
  function loadShared(force){
    if(dirty && !force) return;
    $("a-base").value = g(CFG_KEYS.base) || DEFAULT_BASE;
    $("a-model").value = g(CFG_KEYS.model) || DEFAULT_MODEL;
    $("a-key").value = g(CFG_KEYS.key);
    dirty = false;
    refreshBadge();
  }
  function refreshBadge(){
    var c = getConfig();
    var b = $("apiBadge");
    if(c.key && c.base && c.model){ b.textContent = "API 已配置 · " + c.model; b.className = "badge ok"; }
    else { b.textContent = "API 未配置"; b.className = "badge"; }
  }
  function status(el, msg, cls){ el.textContent = msg; el.className = "status" + (cls ? " " + cls : ""); }
  function download(name, content, mime){
    var blob = new Blob([content], {type:(mime || "text/plain") + ";charset=utf-8"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function escapeHtml(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  /* ---------- 字数统计 ---------- */
  function countChars(t){ return (t || "").replace(/\s/g,"").length; }
  $("articleIn").addEventListener("input", function(){
    $("countInfo").textContent = countChars(this.value) + " 字";
  });

  /* ---------- 评分维度 ---------- */
  function getDims(){
    var out = [];
    var boxes = $("dimBox").querySelectorAll("label.dim");
    for(var i=0;i<boxes.length;i++){
      var cb = boxes[i].querySelector("input[type=checkbox]");
      var num = boxes[i].querySelector("input[type=number]");
      if(cb.checked){
        out.push({name:cb.getAttribute("data-name"), weight:parseInt(num.value || "0", 10)});
      }
    }
    return out;
  }

  /* ---------- 本地体检 ---------- */
  $("btnLocal").addEventListener("click", function(){
    var text = $("articleIn").value.trim();
    var box = $("localBox");
    if(!text){ box.innerHTML = ""; status($("scoreStatus"), "请先粘贴文章正文。", "err"); return; }
    var paras = text.split(/\n+/).map(function(s){ return s.trim(); }).filter(Boolean);
    var sentences = text.replace(/\s/g,"").split(/[。！？.!?]/).filter(function(s){ return s.length; });
    var longSents = sentences.filter(function(s){ return s.length > 45; });
    var cjk = (text.match(/[\u4e00-\u9fff]/g) || []).length;
    var dataMarks = (text.match(/\d[\d,\.]*(?:亿元|万亿元|万元|万平方米|%|％|个百分点|倍|人)/g) || []);
    var cliche = ["不难看出","总而言之","综上所述","首先","其次","破局","赋能","抓手","底层逻辑","顶层设计","赛道","痛点","出牌"];
    var hits = [];
    cliche.forEach(function(w){ var n = text.split(w).length - 1; if(n > 0) hits.push(w + "×" + n); });
    var urlMarks = (text.match(/https?:\/\//g) || []).length;
    var items = [];
    items.push({t:"good", s:"字数 " + countChars(text) + "（汉字 " + cjk + "），段落 " + paras.length + " 段，句数 " + sentences.length + " 句。"});
    items.push({t: longSents.length > 3 ? "warn" : "good",
      s:"长句（45 字以上）" + longSents.length + " 句，占比 " + Math.round(longSents.length / Math.max(sentences.length,1) * 100) + "%。" + (longSents.length > 3 ? "长句偏多，建议拆短，保持节奏。" : "句长控制良好。")});
    items.push({t: dataMarks.length >= 6 ? "good" : "warn",
      s:"可识别数据点 " + dataMarks.length + " 处" + (dataMarks.length ? "（例。" + dataMarks.slice(0,5).join("、") + "）" : "") + "。" + (dataMarks.length >= 6 ? "数据密度达标。" : "少于 6 处，论据偏薄，建议补带时间与规模的数据。")});
    items.push({t: hits.length ? "bad" : "good",
      s:"套话与禁用词扫描。" + (hits.length ? "命中 " + hits.join("、") + "，建议改写。" : "未命中常见套话与禁用词。")});
    items.push({t: urlMarks ? "good" : "warn",
      s:"来源链接 " + urlMarks + " 处。" + (urlMarks ? "来源可追溯。" : "未见链接来源，若为需标注出处的社论请补充。")});
    items.push({t:"good", s:"开头 60 字。" + text.replace(/\s/g,"").slice(0,60) + "……"});
    box.innerHTML = '<ul class="check-list">' + items.map(function(it){
      return '<li class="' + it.t + '">' + escapeHtml(it.s) + '</li>';
    }).join("") + "</ul>";
    status($("scoreStatus"), "本地体检完成。", "ok");
  });

  /* ---------- API 调用 ---------- */
  function callChat(messages, onDone, onFail){
    var c = getConfig();
    if(!c.base || !c.model || !c.key){ onFail(new Error("请先在「接口复用」或生成工作台中配置 base_url、模型名与 API Key。")); return; }
    var url = c.endpoint ? c.endpoint : (c.base + "/chat/completions");
    var ctrl = new AbortController();
    var timer = setTimeout(function(){ try{ ctrl.abort(); }catch(e){} }, c.timeout * 1000);
    fetch(url, {
      method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":"Bearer " + c.key },
      body: JSON.stringify({ model:c.model, messages:messages, temperature:Math.min(c.temp, 0.5) }),
      signal: ctrl.signal
    }).then(function(resp){
      return resp.text().then(function(txt){
        var data = null;
        try{ data = JSON.parse(txt); }catch(e){}
        if(!resp.ok){
          var detail = (data && data.error && data.error.message) ? data.error.message : txt.slice(0,300);
          throw new Error("HTTP " + resp.status + "。" + detail);
        }
        if(!data || !data.choices || !data.choices[0]) throw new Error("接口返回格式异常。");
        return data.choices[0].message.content || "";
      });
    }).then(function(text){ clearTimeout(timer); onDone(text, c); })
    .catch(function(err){
      clearTimeout(timer);
      if(err && err.name === "AbortError"){ onFail(new Error("请求已中止或超时。")); return; }
      if(err && /Failed to fetch|NetworkError|CORS/i.test(String(err.message))){
        onFail(new Error("网络或跨域受限（CORS），请在生成工作台高级选项中配置代理地址。原始错误。" + err.message));
        return;
      }
      onFail(err);
    });
  }

  function parseJsonLoose(text){
    var t = text.replace(/```json/gi,"").replace(/```/g,"").trim();
    var s = t.indexOf("{"), e = t.lastIndexOf("}");
    if(s < 0 || e < 0) throw new Error("模型未返回可解析的 JSON。");
    return JSON.parse(t.slice(s, e + 1));
  }

  var lastReportText = "";
  function renderReport(rep){
    var dims = (rep.dimensions || []).map(function(d){
      var max = d.max || Math.max(d.score || 0, 1);
      var pct = Math.max(0, Math.min(100, Math.round((d.score / max) * 100)));
      return '<div class="bar-row">' +
        '<div class="bl"><span>' + escapeHtml(d.name || "") + '</span><span>' +
        (d.score != null ? d.score : "-") + ' / ' + max + '</span></div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '<div class="cmt">' + escapeHtml(d.comment || "") + '</div></div>';
    }).join("");
    function block(title, arr, asP){
      var body;
      if(Array.isArray(arr) && arr.length){
        body = "<ul>" + arr.map(function(x){ return "<li>" + escapeHtml(x) + "</li>"; }).join("") + "</ul>";
      } else {
        body = "<p>" + escapeHtml(typeof arr === "string" ? arr : "（无）") + "</p>";
      }
      return '<div class="rep-block"><h3>' + title + '</h3>' + body + '</div>';
    }
    $("reportBox").innerHTML =
      '<div class="score-hero">' +
        '<div class="score-big">' + (rep.total != null ? rep.total : "--") + '<small> / 100</small></div>' +
        '<div class="grade-chip">' + escapeHtml(rep.grade || "未评级") + '</div>' +
        '<div style="flex:1;min-width:14rem;color:var(--muted);font-size:.9rem;">' +
          escapeHtml(rep.summary || "") + '</div>' +
      '</div>' + dims +
      block("可改进点", rep.improvements) +
      block("本文精彩之处", rep.highlights) +
      block("可学之处（可迁移的写法）", rep.learnable);
    $("reportPanel").style.display = "";
    lastReportText = [
      "# 文章评分报告", "",
      "- 总分。" + (rep.total != null ? rep.total : "--") + " / 100",
      "- 等级。" + (rep.grade || "未评级"), "",
      "## 各维度评分", ""
    ].concat((rep.dimensions || []).map(function(d){
      return "- **" + d.name + "**。" + d.score + " / " + (d.max || "") + "。" + (d.comment || "");
    })).concat([
      "", "## 总评", "", rep.summary || "", "",
      "## 可改进点", ""
    ]).concat((rep.improvements || []).map(function(x, i){ return (i+1) + ". " + x; })).concat([
      "", "## 本文精彩之处", ""
    ]).concat((rep.highlights || []).map(function(x, i){ return (i+1) + ". " + x; })).concat([
      "", "## 可学之处", ""
    ]).concat((rep.learnable || []).map(function(x, i){ return (i+1) + ". " + x; })).join("\n");
  }

  $("btnSaveApi").addEventListener("click", function(){
    try{
      if($("a-base").value.trim()) localStorage.setItem(CFG_KEYS.base, $("a-base").value.trim());
      if($("a-model").value.trim()) localStorage.setItem(CFG_KEYS.model, $("a-model").value.trim());
      if($("a-key").value.trim()) localStorage.setItem(CFG_KEYS.key, $("a-key").value.trim());
    }catch(e){}
    refreshBadge();
    status($("apiStatus"), "配置已保存，本页与生成工作台共用。", "ok");
  });

  $("btnScore").addEventListener("click", function(){
    var text = $("articleIn").value.trim();
    if(!text){ status($("scoreStatus"), "请先粘贴文章正文。", "err"); return; }
    var dims = getDims();
    if(!dims.length){ status($("scoreStatus"), "至少勾选一个评分维度。", "err"); return; }
    var totalW = dims.reduce(function(a, b){ return a + b.weight; }, 0);
    if(totalW !== 100){ status($("scoreStatus"), "当前权重合计 " + totalW + " 分，将按比例折算到 100 分制。", ""); }

    var dimLine = dims.map(function(d){ return d.name + "（权重 " + d.weight + " 分）"; }).join("、");
    var sys = "你是资深的社论评论员与申论阅卷组长，风格冷静、专业、有锋芒。你只输出 JSON，不输出任何多余文字。";
    var user = [
      "请对下面这篇" + $("s-type").value + "做综合评分。" ,
      "题目或材料要求。" + ($("s-topic").value.trim() || "（未提供，按通用标准）"),
      "目标读者或用途。" + ($("s-audience").value.trim() || "（未提供）"),
      "评分严格度。" + $("s-strict").value,
      "评分维度与权重（合计应折算为 100 分制）。" + dimLine,
      "",
      "评分要求。",
      "1. 每个维度给出 0 至该维度满分的分数与一句至两句点评，点评要具体到文中的句子或段落。",
      "2. 综合评分从论证逻辑、表述水平、语言风格、立意高度等角度出发，兼顾结构层次与素材规范，总分为各维度加权后的 100 分制分数。",
      "3. 可改进点给出 3 至 5 条，每条指出问题位置并给出可操作的改写方向。",
      "4. 本文精彩之处给出 2 至 4 条，引用原文短句说明好在哪里。",
      "5. 可学之处给出 2 至 4 条，提炼可迁移到其他文章的写法与句式。",
      "6. 等级按 90 分以上一类文、80 至 89 二类文、70 至 79 三类文、70 以下四类文标注，也可按该文体通行等级表述。",
      "7. 只输出如下 JSON，不要 markdown 代码块以外的任何文字。",
      "",
      "{\"total\":0,\"grade\":\"等级\",\"dimensions\":[{\"name\":\"维度名\",\"score\":0,\"max\":该维度满分,\"comment\":\"点评\"}],\"improvements\":[\"可改进点\"],\"highlights\":[\"精彩之处\"],\"learnable\":[\"可学之处\"],\"summary\":\"150字内总评\"}",
      "",
      "文章正文如下。", text
    ].join("\n");

    $("btnScore").disabled = true;
    status($("scoreStatus"), "正在调用模型评分，通常需要 20 至 60 秒……", "busy");
    callChat([
      {role:"system", content: sys},
      {role:"user", content: user}
    ], function(out){
      $("btnScore").disabled = false;
      try{
        var rep = parseJsonLoose(out);
        rep.improvements = rep.improvements || [];
        rep.highlights = rep.highlights || [];
        rep.learnable = rep.learnable || [];
        rep.dimensions = rep.dimensions || [];
        renderReport(rep);
        status($("scoreStatus"), "评分完成。", "ok");
        $("reportPanel").scrollIntoView({behavior:"smooth"});
      }catch(e){
        status($("scoreStatus"), "解析失败。" + e.message + " 原始输出前 200 字。" + out.slice(0,200), "err");
      }
    }, function(err){
      $("btnScore").disabled = false;
      status($("scoreStatus"), "评分失败。" + err.message, "err");
    });
  });

  $("btnCopyReport").addEventListener("click", function(){
    if(!lastReportText){ status($("scoreStatus"), "暂无报告可复制。", "err"); return; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(lastReportText).then(function(){ status($("scoreStatus"), "报告已复制。", "ok"); });
    }
  });
  $("btnDownloadReport").addEventListener("click", function(){
    if(!lastReportText){ status($("scoreStatus"), "暂无报告可下载。", "err"); return; }
    download("评分报告.md", lastReportText, "text/markdown");
    status($("scoreStatus"), "已下载 评分报告.md。", "ok");
  });

  /* 初始化与跨页面同步 */
  ["a-base","a-model","a-key"].forEach(function(id){
    $(id).addEventListener("input", function(){ dirty = true; refreshBadge(); });
  });
  $("btnSync").addEventListener("click", function(){
    loadShared(true);
    status($("apiStatus"), "已同步生成工作台的最新配置（含默认 base_url 与模型名）。", "ok");
  });
  window.addEventListener("focus", function(){ loadShared(false); });
  window.addEventListener("storage", function(){ loadShared(false); });
  loadShared(true);
})();
</script>
</body>
</html>
